<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EFEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Groceries</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #E9EFEB;
    --surface: #FFFFFF;
    --ink: #13201A;
    --muted: #56655C;
    --line: #D0DAD3;
    --line-strong: #A9B8AE;
    --accent: #1D6B47;
    --accent-ink: #FFFFFF;
    --accent-soft: #D7EADF;
    --warn: #8A4F00;
    --danger: #A3392A;
    --s-aldi: #1B5A6E;
    --s-costco: #64396A;
    --s-pns: #7E5216;
    --s-target: #384A63;
    --s-other: #4E5B54;
    --scrim: rgba(8, 18, 12, .5);
    --r: 14px;
    --tab-h: 62px;
    --display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1512; --surface: #18211C; --ink: #E4ECE7; --muted: #9AAAA1; --line: #29352E;
      --line-strong: #46564C; --accent: #5DBE8A; --accent-ink: #0B1A11; --accent-soft: #1E3428;
      --warn: #E8A64B; --danger: #EE8270; --scrim: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1512; --surface: #18211C; --ink: #E4ECE7; --muted: #9AAAA1; --line: #29352E;
    --line-strong: #46564C; --accent: #5DBE8A; --accent-ink: #0B1A11; --accent-soft: #1E3428;
    --warn: #E8A64B; --danger: #EE8270; --scrim: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 var(--text);
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px);
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .top {
    max-width: 560px; margin: 0 auto; min-height: 30px;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 0;
    display: flex; justify-content: flex-end;
  }
  .sync { font-size: 13px; color: var(--muted); }
  .sync[data-state="pending"], .sync[data-state="offline"], .sync[data-state="error"] { color: var(--warn); font-weight: 600; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 16px; }

  .vh h1, .setup h1 {
    font-family: var(--display); font-size: 32px; line-height: 1.1; font-weight: 800;
    letter-spacing: -0.015em; margin: 2px 0 4px;
  }
  .lede { margin: 0 0 18px; color: var(--muted); min-height: 1.4em; }
  .fine { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .err { color: var(--danger); font-size: 15px; font-weight: 600; margin: 10px 0 0; }
  .err:empty { display: none; }
  .notice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--warn); }

  .btn {
    min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
    font-weight: 650; font-size: 16px; background: var(--surface); color: var(--ink);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.quiet { background: transparent; color: var(--accent); padding: 0 4px; }
  .btn.danger { background: transparent; color: var(--danger); padding: 0; margin-top: 28px; }
  .btn.wide { width: 100%; }
  .btn:active { transform: translateY(1px); }

  /* ---------- This week */
  .picks, .menu, .lines { list-style: none; margin: 0; padding: 0; }
  .picks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .pick {
    min-width: 0; display: flex; align-items: center; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: var(--r);
  }
  .pick.on { border-color: var(--accent); background: var(--accent-soft); }
  .pick-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    padding: 12px 10px 12px 14px; min-height: 60px; background: none; border: 0; text-align: left;
  }
  .tick, .box {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line-strong); position: relative;
  }
  .box { border-radius: 8px; margin-top: 1px; }
  .tick::after, .box::after {
    content: ""; position: absolute; left: 7px; top: 3px; width: 7px; height: 12px;
    border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: 0;
  }
  .pick.on .tick, .line.done .box { background: var(--accent); border-color: var(--accent); }
  .pick.on .tick::after, .line.done .box::after { opacity: 1; }
  .pick-text { min-width: 0; }
  .pick-name { display: block; font-weight: 650; }
  .pick-sub { display: block; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stepper { display: flex; align-items: center; gap: 2px; padding-right: 8px; flex: none; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); font-size: 22px; line-height: 1; font-weight: 600;
  }
  .count { min-width: 30px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
  .dock {
    position: sticky; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);
    margin-top: 18px; z-index: 3;
  }
  .dock .btn { box-shadow: 0 6px 18px -6px rgba(10, 40, 25, .45); }
  .empty { background: var(--surface); border-radius: var(--r); padding: 18px; border: 1px solid var(--line); }
  .empty p { margin: 0 0 14px; }

  /* ---------- List */
  .add { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 8px; }
  .add input, .add select, .stack input, .field input, .field select, .pk-row input, .pk-row select {
    height: 48px; min-width: 0; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--surface); padding: 0 12px; font-size: 16px;
  }
  .add select { max-width: 116px; padding: 0 8px; }
  .add .btn { padding: 0 16px; }

  .aisle { margin-top: 22px; }
  /* Aisle signs: each store is a full-width band that sticks to the top while
     you scroll its items, so you always know which store's list you're in. */
  .sign {
    --sign: var(--s-other);
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 0 -16px 10px; padding: 12px 16px 11px;
    background: var(--sign); color: #fff;
    font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -0.01em;
  }
  .aisle[data-store="aldi"] .sign { --sign: var(--s-aldi); }
  .aisle[data-store="costco"] .sign { --sign: var(--s-costco); }
  .aisle[data-store="pns"] .sign { --sign: var(--s-pns); }
  .aisle[data-store="target"] .sign { --sign: var(--s-target); }
  .sign .left { font-family: var(--text); font-size: 14px; font-weight: 600; opacity: .88; white-space: nowrap; }

  .lines { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .line { display: flex; align-items: flex-start; border-top: 1px solid var(--line); }
  .line:first-child { border-top: 0; }
  .hit {
    flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; text-align: left;
    padding: 14px 6px 14px 14px; min-height: 64px; background: none; border: 0;
  }
  .what { min-width: 0; }
  .name { display: block; font-weight: 650; }
  .qty { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail { display: block; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .for { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .needs .detail { color: var(--warn); }
  .line.done .name, .line.done .qty { text-decoration: line-through; text-decoration-thickness: 2px; }
  .line.done .what { opacity: .5; }
  .ctl { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding: 12px 12px 12px 0; }
  .move {
    position: relative; display: inline-block; font-size: 13px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
  }
  .move select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; }
  .fix { background: none; border: 0; padding: 4px 0; color: var(--warn); font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 20px; line-height: 1; }
  .foot { margin-top: 28px; text-align: center; }

  /* ---------- Meals */
  .menu { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .menu li + li { border-top: 1px solid var(--line); }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 56px; }
  .menu:empty { display: none; }
  .more { margin-top: 32px; }
  .more h2 { font-family: var(--display); font-size: 21px; font-weight: 800; margin: 0; }
  .more .btn.quiet { margin-top: 6px; }

  /* ---------- Setup */
  .setup { padding-top: 24px; }
  .setup p { color: var(--muted); }
  .stack { display: grid; gap: 10px; margin-top: 18px; }
  code { font-size: .92em; background: var(--surface); padding: 1px 5px; border-radius: 5px; }

  /* ---------- Tabs */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    position: relative; height: var(--tab-h); background: none; border: 0;
    font-size: 15px; font-weight: 650; color: var(--muted);
  }
  .tabs button[aria-current="page"] { color: var(--accent); }
  .tabs button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
  }
  .badge:not(:empty) {
    display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums;
  }

  /* ---------- Sheets */
  #overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; }
  .sheet {
    width: 100%; max-width: 560px; margin: 0 auto;
    height: calc(100% - env(safe-area-inset-top) - 10px);
    background: var(--bg); border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet.small { height: auto; max-height: calc(100% - env(safe-area-inset-top) - 10px); }
  .sheet-bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .sheet-bar h2 { margin: 0; font-size: 17px; font-weight: 750; }
  .sheet-bar .btn:first-child { justify-self: start; }
  .sheet-bar .btn:last-child { justify-self: end; min-height: 40px; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 28px); -webkit-overflow-scrolling: touch; }
  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field > span { font-size: 14px; font-weight: 650; color: var(--muted); }
  .field input#ed-name { font-size: 19px; font-weight: 650; height: 52px; }
  .pk-name { font-family: var(--display); font-size: 22px; font-weight: 800; margin: 0 0 14px; }
  .pk-row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }

  .ing-head, .ing { display: grid; grid-template-columns: minmax(0, 1fr) 54px 76px 28px; gap: 6px; }
  .ing-head { font-size: 14px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
  .ing-head span:last-child { grid-column: 2 / 4; }
  .ing { align-items: center; margin-bottom: 8px; }
  .ing input, .ing select {
    height: 46px; min-width: 0; width: 100%; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface); padding: 0 8px; font-size: 16px;
  }
  .ing select { padding: 0 2px; }
  .ing-qty { text-align: center; font-variant-numeric: tabular-nums; }
  .ing-x { width: 28px; height: 34px; padding: 0; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 22px; }
  .ing-warn { grid-column: 1 / -1; margin: -2px 0 2px; font-size: 13px; line-height: 1.35; color: var(--warn); }
  .ing-warn:empty { display: none; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);
    max-width: calc(100% - 32px); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 600;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: rise .22s ease-out; }
    @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
  <header class="top"><span id="sync" class="sync" role="status" aria-live="polite"></span></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button data-act="go" data-view="week">This week</button>
    <button data-act="go" data-view="list">List<span class="badge" id="list-badge"></span></button>
    <button data-act="go" data-view="meals">Meals</button>
  </nav>
  <div id="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <datalist id="ing-list"></datalist>
  <script src="config.js"></script>
  <script src="math.js"></script>
  <script src="app.js"></script>
</body>
</html>
